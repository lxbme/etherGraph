[etherscan]
api_key = "..."            # 也可以用环境变量 ETHERSCAN_API_KEY
# measured free tier: 3.0/s ≈20% rate-limited, 2.8/s ≈8%, 2.5/s ≈0–3%
rate_per_sec = 2.5
daily_limit = 100000

[sync]
max_records_per_category = 10000
stale_after_secs = 600
reorg_window_blocks = 64
workers = 4
hot_neighbor_threshold = 500

[ens]
universal_resolver = "0xeEeEEEeE14D718C2B47D9923Deab1335E144EeEe"   # 可覆盖
multicall3 = "0xcA11bde05977b3631167028862bE2a173976CA11"
# eth_call is sent as POST; 200 calls per batch verified
multicall_batch_size = 100

[source]
mode = "etherscan"
fixtures_dir = "fixtures"

[server]
listen = "127.0.0.1:8080"
database_url = "postgres://eg:eg@localhost:54329/eg"
static_dir = "web/dist"

[auth]
# Scheme, host and port the browser opens (no trailing slash); login messages
# and the Origin check of state-changing requests use it.
public_origin = "http://127.0.0.1:8080"
# Admin wallet addresses, e.g. ["0x…"]. Empty: nobody can enter admin mode.
admins = []
# Etherscan calls per user per day (admins can change it in the admin panel)
default_daily_quota = 5000
session_days = 7
admin_session_minutes = 60
# Only behind a reverse proxy you trust: take the client IP from X-Forwarded-For
trust_forwarded_for = false
