[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
alloy-primitives = { version = "1.7", features = ["serde"] }
alloy-rlp = "0.3"
alloy-sol-types = "1.7"
alloy-dyn-abi = "1.7"
alloy-json-abi = "1.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "bigdecimal", "json"] }
bigdecimal = "0.4"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl"] }
wiremock = "0.6"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ens-normalize-rs = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
csv = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
anyhow = "1" # only used in eg-server
