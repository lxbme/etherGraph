[package]
name = "eg-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eg-core = { path = "../eg-core" }
eg-decode = { path = "../eg-decode" }
eg-store = { path = "../eg-store" }
eg-etherscan = { path = "../eg-etherscan" }
eg-blockscout = { path = "../eg-blockscout" }
eg-ingest = { path = "../eg-ingest" }
alloy-primitives = { workspace = true, features = ["k256"] }
anyhow = { workspace = true }
bytes = "1"
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
alloy-json-abi = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ts-rs = { workspace = true }
unicode-normalization = "0.1.25"
parquet = { version = "60.0.0", default-features = false, features = ["snap", "zstd"] }

[dev-dependencies]
alloy-sol-types = { workspace = true }
eg-core = { path = "../eg-core", features = ["testing"] }
http-body-util = "0.1"
k256 = { workspace = true }
rand = { workspace = true }
tower = { workspace = true, features = ["util"] }
async-trait = { workspace = true }
wiremock = { workspace = true }
